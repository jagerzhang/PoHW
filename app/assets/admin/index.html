<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>答题守护 · 手机管理</title>
<link rel="stylesheet" href="/style.css"></head>
<body><main>
<h1>答题守护 <small>手机管理</small></h1>
<p class="tip">仅在同一 WiFi 的局域网内可用，数据不经过任何外部服务器。</p>
<section id="login"><h2>验证家长密码</h2>
<input id="pin" type="password" inputmode="numeric" placeholder="4-8 位数字密码" maxlength="8">
<button id="loginBtn">进入管理</button><p id="loginMsg" class="msg"></p></section>
<section id="panel" hidden>
  <h2>当前状态</h2>
  <div id="status" class="grid"></div>
  <div id="form"></div>
  <button id="saveBtn">保存并生效</button>
  <button id="reloadBtn" class="ghost">重新读取电视设置</button>
  <p id="saveMsg" class="msg"></p>
  <p class="tip">设置会立即通知电视上的守护服务；电视端家长设置仍可继续使用。
  家长密码、错题库清空、关闭手机管理、在线题库地址等敏感项只能在电视上操作。</p>
</section></main><script src="/app.js"></script></body></html>
